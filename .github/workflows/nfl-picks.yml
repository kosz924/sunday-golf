name: Weekly NFL Picks

on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL Week number to run (leave blank to auto-detect)"
        required: false
        default: ""
      season:
        description: "Season year (defaults to 2026)"
        required: false
        default: "2026"
  schedule:
    # 8:00 AM US/Eastern every Saturday (12:00 UTC during EDT)
    - cron: "0 12 * * 6"

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SEASON: ${{ github.event.inputs.season || '2026' }}
      FTN_USER_ID: ${{ secrets.FTN_USER_ID }}
      FTN_PASSWORD: ${{ secrets.FTN_PASSWORD }}
      FTN_KEY: ${{ secrets.FTN_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine upcoming week
        id: week
        env:
          INPUT_WEEK: ${{ github.event.inputs.week }}
        run: |
          python - <<'PY'
          import os, requests

          manual_week = os.environ.get("INPUT_WEEK", "").strip()
          if manual_week:
              print(f"Using manually specified week: {manual_week}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"week={manual_week}\n")
              exit(0)

          SCOREBOARD_URL = "https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"
          season = int(os.environ.get("SEASON", "2026"))
          next_week = None
          
          # 1. Check Regular Season (Weeks 1-18)
          for wk in range(1, 19):
              try:
                  resp = requests.get(
                      SCOREBOARD_URL,
                      params={"dates": season, "seasontype": 2, "week": wk},
                      timeout=20,
                  )
                  resp.raise_for_status()
                  data = resp.json()
              except Exception as exc:  # pylint: disable=broad-except
                  print(f"::warning::Failed to fetch reg week {wk}: {exc}")
                  continue

              events = data.get("events") or []
              if not events:
                  continue

              states = [
                  (ev.get("status") or {}).get("type", {}).get("state")
                  for ev in events
              ]
              if any(state != "post" for state in states if state):
                  next_week = wk
                  break
          
          # 2. Check Postseason (Weeks 1-5) if no regular season week found
          if next_week is None:
              print("Regular season complete; checking postseason...")
              for wk in range(1, 6):
                  try:
                      resp = requests.get(
                          SCOREBOARD_URL,
                          params={"dates": season, "seasontype": 3, "week": wk},
                          timeout=20,
                      )
                      resp.raise_for_status()
                      data = resp.json()
                  except Exception as exc:
                      print(f"::warning::Failed to fetch post week {wk}: {exc}")
                      continue

                  events = data.get("events") or []
                  if not events:
                      continue

                  states = [
                      (ev.get("status") or {}).get("type", {}).get("state")
                      for ev in events
                  ]
                  if any(state != "post" for state in states if state):
                      next_week = 18 + wk
                      break

          if next_week is None:
              print("::warning::No upcoming week detected; defaulting to 18.")
              next_week = 18

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"week={next_week}\n")
          print(f"Using week {next_week} for season {season}.")
          PY

      - name: Run picks and submit
        env:
          WDM_LOG_LEVEL: 0
        run: |
          python nfl_picks.py ${{ steps.week.outputs.week }} \
            --season "$SEASON" \
            --odds-provider polymarket \
            --odds-api-key "$ODDS_API_KEY" \
            --login-id "$FTN_USER_ID" \
            --login-password "$FTN_PASSWORD" \
            --login-key "$FTN_KEY" \
            --compare-existing \
            --submit \
            --non-interactive \
            --selenium-browser chrome
